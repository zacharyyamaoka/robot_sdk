[project]
name = "robot-sdk"
version = "0.1.0"
description = "A generic robotics backend in Python: one install for the robot-* packages, pinned to versions that work together."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Zach Yamaoka"}]
keywords = ["robotics", "robot", "sdk", "sim2real", "kinematics", "control"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
]
# WHY (Zach, 2026-11-23): the packages stay separate repos and separate PyPI names;
# this metapackage only pins which versions go together. Core layers use ~= (patch
# updates only) because every leaf imports them; leaves move fast on 0.x.
dependencies = [
  # core vocabulary - every package imports these
  "robot-msgs~=0.3.1",
  "robot-models-lib~=0.3.0",
  # leaves - depend on core only, never on each other
  "robot-controllers~=0.1.0",
  "robot-reach~=0.1.0",
  "robot-thermal~=0.1.0",
  "robot-trajectories~=0.1.0",
  "robot-autonomy~=0.1.0",
  "robot-metrics~=0.1.0",
  "robot-activity~=0.1.1",
  # viewers - views of robot_msgs data; depend on robot_msgs (and leaves), and nothing depends on them
  "traj-compare~=0.1.0",
  # outer API - may import everything below
  "sim2real~=0.1.0",
  # checks - diagnostics on top of metrics and sim2real (those two only via its `stock` extra)
  "robot-diagnostics~=0.1.0",
  # communication
  "like_keras~=0.1.0",
]

[project.urls]
Homepage = "https://github.com/zacharyyamaoka/robot_sdk"
Repository = "https://github.com/zacharyyamaoka/robot_sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest"]
# examples/pick_and_place.py: the simulated UR5e (MuJoCo, pinned as sim2real's and robot_controllers' extras) and its plots.
# WHY a group, not a dependency: the metapackage pins packages; an example's simulator and plotting stay opt-in.
examples = ["mujoco==3.11.0", "matplotlib>=3.8"]

# Local development: every package resolves to its sibling checkout, editable,
# so one `uv sync` here gives a workspace over all of them (vcstool + colcon, ROS-style).
[tool.uv.sources]
robot-msgs = { path = "../robot_msgs", editable = true }
robot-models-lib = { path = "../robot_models", editable = true }
robot-controllers = { path = "../robot_controllers", editable = true }
robot-reach = { path = "../robot_reach", editable = true }
robot-thermal = { path = "../robot_thermal", editable = true }
robot-trajectories = { path = "../robot_trajectories", editable = true }
robot-autonomy = { path = "../robot_autonomy", editable = true }
robot-metrics = { path = "../robot_metrics", editable = true }
robot-activity = { path = "../robot_activity", editable = true }
traj-compare = { path = "../traj_compare", editable = true }
sim2real = { path = "../sim2real", editable = true }
robot-diagnostics = { path = "../robot_diagnostics", editable = true }
like_keras = { path = "../like_keras", editable = true }
